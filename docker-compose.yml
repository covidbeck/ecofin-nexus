services:
  db:
    image: postgres:16
    container_name: ecofin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecofin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecofin}
      POSTGRES_DB: ${POSTGRES_DB:-ecofin}
    ports:
      # Only reachable from this laptop — do not expose Postgres to the LAN.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecofin} -d ${POSTGRES_DB:-ecofin}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecofin-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ecofin}:${POSTGRES_PASSWORD:-ecofin}@db:5432/${POSTGRES_DB:-ecofin}
      POSTGRES_USER: ${POSTGRES_USER:-ecofin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecofin}
      POSTGRES_DB: ${POSTGRES_DB:-ecofin}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-pro}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./:/project
      - ./generate_test_bill.py:/app/generate_test_bill.py:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecofin-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  frontend_node_modules:
